<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Scan Results – PhishGuard</title>
<meta name="robots" content="noindex">
</head>
<body data-page="results">
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <h1 data-i18n="res_title"></h1>
    <p class="sub" data-i18n="page_sub"></p>
    <form class="scan-form" id="scanForm" novalidate>
        <label for="urlInput" class="sr-only" data-i18n="input_label"></label>
        <input id="urlInput" type="text" inputmode="url" autocomplete="off" spellcheck="false" maxlength="2048" placeholder="https://example.com/login">
        <button class="btn" type="submit" data-i18n="scan_short"></button>
      </form>
      <p class="field-error" id="fieldError" role="alert"></p>
    <div id="resultRoot" aria-live="polite"></div>
    <p class="disclaimer" data-i18n="disclaimer"></p>
  </main>
</div>
<script src="js/config.js"></script><script src="js/i18n.js"></script><script src="js/app.js"></script>
</body></html>
